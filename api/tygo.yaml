# Tygo configuration for TypeScript generation from Go structs
# See: https://github.com/gzuidhof/tygo

packages:
  # Main API models package
  - path: "github.com/ditwrd/yawn/api/internal/domain/models"
    output_path: "../shared/models.ts"
    type_mappings:
      time.Time: "string"
      uuid.UUID: "string"
      "*uint": "number | null"
      "*int": "number | null"
      "*string": "string | null"
      "*bool": "boolean | null"
      "*time.Time": "string | null"
      "*uuid.UUID": "string | null"
      interface{}: "any"
    exclude:
      - "gorm.DeletedAt"  # Exclude GORM soft delete field
      - "gorm.Model"      # Exclude GORM base model
    custom_tags:
      - "json"
      - "validate"

  # DTOs package for API request/response types
  - path: "github.com/ditwrd/yawn/api/internal/interfaces/dto"
    output_path: "../shared/dto.ts"
    type_mappings:
      time.Time: "string"
      uuid.UUID: "string"
      "*uint": "number | null"
      "*int": "number | null"
      "*string": "string | null"
      "*bool": "boolean | null"
      "*time.Time": "string | null"
      "*uuid.UUID": "string | null"
      interface{}: "any"
    exclude:
      - "validator.Func"
    custom_tags:
      - "json"
      - "validate"

# Global type mappings that apply to all packages
type_mappings:
  # Standard Go types to TypeScript
  string: "string"
  int: "number"
  int8: "number"
  int16: "number"
  int32: "number"
  int64: "number"
  uint: "number"
  uint8: "number"
  uint16: "number"
  uint32: "number"
  uint64: "number"
  float32: "number"
  float64: "number"
  bool: "boolean"

  # Special types
  time.Time: "string"
  uuid.UUID: "string"

  # Pointer types (nullable)
  "*string": "string | null"
  "*int": "number | null"
  "*int32": "number | null"
  "*int64": "number | null"
  "*uint": "number | null"
  "*uint32": "number | null"
  "*uint64": "number | null"
  "*float32": "number | null"
  "*float64": "number | null"
  "*bool": "boolean | null"
  "*time.Time": "string | null"
  "*uuid.UUID": "string | null"

  # Interface types
  interface{}: "any"
  any: "any"

# Exclude certain types globally
exclude:
  - "gorm.Model"
  - "gorm.DeletedAt"
  - "validator.Func"
  - "echo.Context"
  - "http.Handler"
  - "context.Context"

# Include only public types (starts with capital letter)
include_unexported: false

# Generate export statements
export: true

# File header comment
header: |
  // Generated TypeScript types from Go structs
  // This file is auto-generated by tygo. Do not edit manually.
  // Generation time: {{.Timestamp}}
  // Package: {{.Package}}